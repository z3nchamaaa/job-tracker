name: 不具合報告
description: 個人データを含めずに再現手順を共有してください
body:
  - type: markdown
    attributes:
      value: 脆弱性は公開Issueに投稿せず、READMEの非公開報告方針に従ってください。DB・プロフィール・APIキー・認証コード・環境変数・未加工ログは添付しないでください。
  - type: input
    id: version
    attributes:
      label: アプリのバージョン
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS・CPU・Nodeの版
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 架空データでの再現手順と期待する動作
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 個人情報・DB・キー・認証コードを含めていません
          required: true
