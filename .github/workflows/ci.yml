name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=low
      - run: node --test --test-timeout=30000 test/*.test.cjs
      - run: npm run security:audit
      - run: npm run sbom
      - name: Bundled Node works without a system Node
        run: node scripts/test-bundled-node.cjs
      - name: Windows Desktop Runtime prerequisite
        if: runner.os == 'Windows'
        shell: powershell
        run: ./platforms/windows/test-desktop-runtime.ps1
      - name: Windows setup compiles (x64 and ARM64)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./platforms/windows/test-installer.ps1
      - name: Copilot UI and layout (macOS)
        if: runner.os == 'macOS'
        run: |
          node scripts/check-copilot.cjs
          node scripts/check-ai-agents.cjs
          node scripts/check-kanban-expansion.cjs
          node scripts/check-dashboard-scroll.cjs
      - name: Native Node.js detection (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/verification
          swiftc -O platforms/macos/Host.swift -framework AppKit -framework WebKit -framework Security -framework CryptoKit -framework LocalAuthentication -o dist/verification/JobTrackerHost
          node scripts/test-macos-node-resolution.cjs dist/verification/JobTrackerHost
          node scripts/test-macos-node-resolution.cjs dist/verification/JobTrackerHost --package-fixture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verification-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            dist/sbom/*.json
            dist/verification/*.json
            dist/screenshots/copilot-*.png
  mac-candidate:
    name: macOS candidate
    needs: core
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/verify-distribution.cjs
      - run: npm run release:check -- --candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-macos-candidate
          retention-days: 7
          path: |
            dist/mac-arm64/*.dmg
            dist/mac-arm64/*.zip
            dist/mac-arm64/*.cdx.json
            dist/mac-arm64/SHA256SUMS
            dist/mac-arm64/release-manifest.json
  windows-compile:
    name: Windows compile (${{ matrix.runtime }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            arch: x64
          - runtime: win-arm64
            arch: arm64
    needs: core
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.402
      - run: npm ci --ignore-scripts --cpu=${{ matrix.arch }}
      - run: ./platforms/windows/build.ps1 -Runtime ${{ matrix.runtime }} -BuildInstaller
      - run: node scripts/release-check.cjs --candidate dist/${{ matrix.runtime }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.runtime }}-candidate
          retention-days: 7
          path: |
            dist/${{ matrix.runtime }}/*-portable.zip
            dist/${{ matrix.runtime }}/job-tracker-*-win-*.exe
            dist/${{ matrix.runtime }}/*.cdx.json
            dist/${{ matrix.runtime }}/SHA256SUMS
            dist/${{ matrix.runtime }}/release-manifest.json
