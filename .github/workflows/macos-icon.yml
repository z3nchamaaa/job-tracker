name: macOS icon
on:
  push:
    branches: ['codex/**', main]
    paths: ['assets/icons/**', 'scripts/macos-icon.cjs', '.github/workflows/macos-icon.yml']
  pull_request:
    paths: ['assets/icons/**', 'scripts/macos-icon.cjs', '.github/workflows/macos-icon.yml']
permissions:
  contents: read
jobs:
  compile:
    name: Compile native macOS icon
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: node scripts/macos-icon.cjs --compile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-icon
          retention-days: 7
          path: |
            dist/macos-icon/Assets.car
            dist/macos-icon/manifest.json
